services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: slotcrm
      POSTGRES_PASSWORD: slotcrm
      POSTGRES_DB: slotcrm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_jobs.sql:/docker-entrypoint-initdb.d/002_jobs.sql:ro
      - ./db/003_auth.sql:/docker-entrypoint-initdb.d/003_auth.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotcrm"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:                      # dev mail catcher: UI on http://localhost:8025
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://slotcrm:slotcrm@postgres:5432/slotcrm
      REDIS_URL: redis://redis:6379
      # first admin login, created only while no admin exists (see README > Admin logins)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set true when served over HTTPS
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://slotcrm:slotcrm@postgres:5432/slotcrm
      REDIS_URL: redis://redis:6379
      # defaults send to the Mailpit catcher; set these in a .env file for real email (see .env.example)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Event Bookings <bookings@example.org>}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: slotcrm
      POSTGRES_PASSWORD: slotcrm
      POSTGRES_DB: slotcrm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_jobs.sql:/docker-entrypoint-initdb.d/002_jobs.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotcrm"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:                      # dev mail catcher: UI on http://localhost:8025
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://slotcrm:slotcrm@postgres:5432/slotcrm
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://slotcrm:slotcrm@postgres:5432/slotcrm
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "Event Bookings <bookings@example.org>"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
